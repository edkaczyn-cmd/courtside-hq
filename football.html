<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5e6673;--line:#e3e6eb;--hd:#11161f;--acc:#e8641b;--acc2:#1d5fd1;--good:#1e8e4e;--bad:#c93a2e;--warn:#b7791f;--chip:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--hd);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--acc);box-shadow:inset -4px -3px 0 rgba(0,0,0,.18)}
.sport{display:flex;gap:6px}
.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12px;color:#cfd6e2;background:transparent}
.pill.on{background:#fff;color:var(--hd);border-color:#fff;font-weight:600}
.pill[disabled]{opacity:.55}
.stamp{margin-left:auto;font-size:12px;color:#aab3c2}
nav{background:#1a2130;display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:50px;z-index:19}

nav button.on{color:#fff;border-bottom-color:var(--acc)}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input[type=text],input[type=number],input[type=search],textarea{border:1px solid #cfd4dc;border-radius:7px;padding:6px 9px;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical;font-size:12.5px}
.btn{border:1px solid #cfd4dc;background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#9aa3b0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:#fde7da;border-color:#f3a77c;color:#9a3a07;text-decoration:line-through}
.chip.x:after{content:" ×";color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f7f8fa;text-align:right;font-weight:600;color:#3b4250;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
th.l,td.l{text-align:left}
td{padding:6px 8px;border-bottom:1px solid #f0f2f5;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfc}
tr.mine td{background:#fff7f1}
.pn{font-weight:600;cursor:pointer;color:var(--ink)}
.pn:hover{color:var(--acc2);text-decoration:underline}
.meta{color:var(--mute);font-size:11.5px;margin-left:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.t-out{background:#fde2df;color:#a32a1f}.t-gtd{background:#fdf1d6;color:#8a5a0b}.t-own{background:#e6eefc;color:#1d4fb0}.t-me{background:#fde7da;color:#9a3a07}
.t-buy{background:#ddf3e6;color:#17693b}.t-sell{background:#fde2df;color:#a32a1f}.t-add{background:#e6eefc;color:#1d4fb0}.t-brk{background:#efe5fb;color:#5b2ea6}
.val{font-weight:700}
.up{color:var(--good)}.dn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}nav{top:0;position:relative}header{position:relative}}
.list .it{padding:10px 0;border-bottom:1px solid #f0f2f5}
.list .it:last-child{border-bottom:0}
.why{color:#3b4250;font-size:12.5px;margin-top:3px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpi div{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:130px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11.5px;color:var(--mute)}
.verdict{font-size:20px;font-weight:700;padding:10px 14px;border-radius:8px;margin:6px 0 4px;display:inline-block}
.v-win{background:#ddf3e6;color:#17693b}.v-lose{background:#fde2df;color:#a32a1f}.v-even{background:#eef1f5;color:#3b4250}
.picker{position:relative}
.dd{position:absolute;z-index:30;background:#fff;border:1px solid #cfd4dc;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;width:100%;margin-top:2px}
.dd div{padding:7px 10px;cursor:pointer;font-size:13px}
.dd div:hover{background:#f3f5f8}
.slot{display:flex;justify-content:space-between;align-items:center;background:#f7f8fa;border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin:5px 0;font-size:13px}
.empty{color:var(--mute);font-size:13px;padding:14px;text-align:center;border:1px dashed #cfd4dc;border-radius:8px}
.note{background:#f2f6fd;border:1px solid #d7e3f8;color:#1f3c6e;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warnnote{background:#fff8ec;border-color:#f3dcae;color:#6b4a0f}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal.on{display:flex}
.modal .card{max-width:760px;width:100%}
.board{font-size:11.5px}
.board td{text-align:left;padding:4px 6px;border:1px solid #eef0f3;min-width:92px}
.board td.me{background:#fff3ea}
.board td.now{outline:2px solid var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1d5fd1}
.dot.inj{background:#e9b8b2}
.day.today{background:#fff3ea}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
footer{max-width:1280px;margin:0 auto;padding:4px 18px 30px;color:var(--mute);font-size:12px}
footer a{color:var(--mute)}
a{color:var(--acc2)}
.hide{display:none!important}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
</style>

<body>
<header>
  <div class="brand"><i style="background:#7a4a24"></i>Courtside HQ</div>
  <div class="sport"><a class="pill" href="index.html" style="text-decoration:none">NBA</a><button class="pill on">NFL</button><button class="pill" disabled title="Baseball rankings and mock drafts arrive before January">MLB · Jan</button></div>

<main>
  <style>.lgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:14px}.lgbar select{font-weight:600;max-width:260px}.lgsum{font-size:12.5px;color:var(--mute)}</style>

</main>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="card" id="mcard"></div></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['’.`]/g,'').replace(/[^a-z]+/g,' ').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,' ').replace(/\s+/g,' ').trim();
const f1=x=>x==null||isNaN(x)?'–':(+x).toFixed(1);
const f0=x=>x==null||isNaN(x)?'–':Math.round(x).toString();
const sgn1=x=>(x>0?'+':'')+f1(x);
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
const K=['att','cmp','pyd','ptd','int','car','ryd','rtd','tgt','rec','recyd','rectd','fl','two','fg03','fg4','fg5','fgx','xpm','xpx'];
const POS=['QB','RB','WR','TE'];
const activePos=()=>parseSlots().K?[...POS,'K']:POS;
const SUPPORTED=['QB','RB','WR','TE','K','FLEX','SFLEX'];
const PRESETS={half:{rec:.5,lbl:'Half PPR'},ppr:{rec:1,lbl:'PPR'},std:{rec:0,lbl:'Standard'}};
const DEFAULT_LEAGUE={name:'My League',size:12,slots:'QB,RB,RB,WR,WR,TE,FLEX',bench:6,rounds:15,type:'redraft',lastWeek:17,playoffs:'15,16,17',scoring:{rec:.5,ptd:4,pyd:25,int:-2,ryd:10,td:6,fl:-2,two:2,tep:0,fgx:-1},my:0,teams:[],ovr:{}};
let L=JSON.parse(JSON.stringify(DEFAULT_LEAGUE));
let DATA=null,P=[],BYID={},BYKEY={},BYABBR={},OWN={},REPL={};
const V={pos:'ALL',q:'',avail:'all',sort:'vor',limit:150};
const T={give:[],get:[],partner:-1};
const LG={rec0:0,pass:{ypa:6.9,td:.045,int:.022},rush:{QB:[5.2,.045],RB:[4.3,.03],WR:[6.5,.03],TE:[4,.05],K:[0,0]},rec:{QB:[0,0,0],RB:[.78,5.9,.03],WR:[.64,8.2,.045],TE:[.72,7.2,.05],K:[0,0,0]}};

/* ---------- scoring & projection ---------- */
function pts(x,pos){const S=L.scoring;return (x.pyd||0)/S.pyd+(x.ptd||0)*S.ptd+(x.int||0)*S.int+((x.ryd||0)+(x.recyd||0))/S.ryd+((x.rtd||0)+(x.rectd||0))*S.td+(x.rec||0)*(S.rec+(pos==='TE'?S.tep:0))+(x.fl||0)*S.fl+(x.two||0)*S.two+3*(x.fg03||0)+4*(x.fg4||0)+5*(x.fg5||0)+(x.xpm||0)+((x.fgx||0)+(x.xpx||0))*(S.fgx==null?-1:S.fgx)}
const playoffWeeks=()=>String(L.playoffs).split(/[ ,]+/).map(Number).filter(Boolean);
function rowObj(r){const o={wk:r[0],opp:r[1],snap:r[2+K.length]};K.forEach((k,i)=>o[k]=r[i+2]);return o}
function project(p){
  const G=p.games, n=G.length, last=G.slice(-4), B=p.base&&p.base.g>=4?p.base:null;
  const avg=(arr,k)=>arr.length?arr.reduce((s,g)=>s+(g[k]||0),0)/arr.length:0;
  const sum=(k)=>G.reduce((s,g)=>s+(g[k]||0),0);
  const vol=k=>{ if(!n) return B?B[k]:0; const S=avg(G,k), cur=n>=4?.55*S+.45*avg(last,k):S; if(!B) return cur; const w=n/(n+3); return w*cur+(1-w)*B[k]; };
  const rate=(numK,oppK,lg,pseudo,cap)=>{const co=sum(oppK),cn=sum(numK);let po=0,pn=0; if(B&&B[oppK]>0){po=Math.min(B[oppK]*B.g,cap);pn=po*B[numK]/B[oppK];} const d=co+po+pseudo; return d>0?(cn+pn+lg*pseudo)/d:lg;};
  const pos=p.pos, rr=LG.rush[pos], rc=LG.rec[pos], E={};
  if(pos==='K'){const KA={fg03:1.0,fg4:.45,fg5:.3,fgx:.25,xpm:2.3,xpx:.1};Object.keys(KA).forEach(k=>E[k]=.5*vol(k)+.5*KA[k]);return E;} // kickers are noisy: regress halfway to league average
  E.att=vol('att'); E.car=vol('car'); E.tgt=vol('tgt');
  E.pyd=E.att*rate('pyd','att',LG.pass.ypa,100,400); E.ptd=E.att*rate('ptd','att',LG.pass.td,250,400); E.int=E.att*rate('int','att',LG.pass.int,300,400);
  E.ryd=E.car*rate('ryd','car',rr[0],50,200); E.rtd=E.car*rate('rtd','car',rr[1],150,200);
  E.rec=E.tgt*rate('rec','tgt',rc[0]||.65,40,120); E.recyd=E.tgt*rate('recyd','tgt',rc[1]||7,50,120); E.rectd=E.tgt*rate('rectd','tgt',rc[2]||.04,150,120);
  E.fl=(sum('fl')+.08*4)/(n+4); E.two=(sum('two')+.03*4)/(n+4);
  return E;
}
function availability(p,w){
  const cur=DATA.curWeek, o=L.ovr[p.id];
  if(o!=null&&o!==''){ if(+o===0) {} else return w>=+o?(w===+o?.85:.95):0; }
  else if(p.st==='RES') return w<cur+4?0:.35;
  else if(p.st==='INA'||p.st==='SUS') return w<cur+1?0:.6;
  let a=w>cur?.95:1;
  if(p.inj&&w===cur){const s=p.inj.s, fresh=p.inj.wk===cur; if(/out/i.test(s)) a=fresh?0:.5; else if(/doubt/i.test(s)) a=fresh?.25:.6; else if(/quest/i.test(s)) a=fresh?.8:.92;}
  if(p.inj&&w===cur+1&&p.inj.wk===cur&&/out/i.test(p.inj.s)) a*=.85;
  return a;
}
function build(){
  const F=DATA.fields, BF=DATA.bfields;
  P=DATA.players.map((r,i)=>{
    const p={i,id:r.id,n:r.n,pos:r.pos,t:r.t,st:r.st,sd:r.sd,inj:r.inj||null,exp:r.exp,age:r.age,key:norm(r.n)};
    p.games=(r.g||[]).map(rowObj);
    p.base=r.b?Object.fromEntries(BF.map((f,j)=>[f==='g'?'g':K[j-1],r.b[j]])):null;
    return p;
  });
  BYID={};BYKEY={};BYABBR={};const cnt={};
  P.forEach(p=>{BYID[p.id]=p;BYKEY[p.key]=p;const pa=p.key.split(' ');p.abbr=pa[0][0]+' '+pa.slice(1).join(' ');cnt[p.abbr]=(cnt[p.abbr]||0)+1});
  P.forEach(p=>{if(cnt[p.abbr]===1)BYABBR[p.abbr]=p});
}
function oppOf(t,w){const o=(DATA.sched[t]||{}).opp||{};return o[w]||null}
function compute(){
  const cur=DATA.curWeek, last=+L.lastWeek||17, POW=playoffWeeks();
  P.forEach(p=>{
    p.E=project(p); p.ppg=pts(p.E,p.pos);
    p.sppg=p.games.length?p.games.reduce((s,g)=>s+pts(g,p.pos),0)/p.games.length:null;
    const l4=p.games.slice(-4); p.l4=l4.length?l4.reduce((s,g)=>s+pts(g,p.pos),0)/l4.length:null;
    p.wk=[]; for(let w=cur;w<=last;w++){const opp=oppOf(p.t,w); if(!opp){p.wk.push({w,opp:null,m:0,a:0,pts:0});continue} const m=((DATA.dvp[opp.replace('@','')]||{})[p.pos])||1, a=availability(p,w); p.wk.push({w,opp,m,a,pts:p.ppg*m*a});}
    p.ros=p.wk.reduce((s,x)=>s+x.pts,0); p.gl=p.wk.reduce((s,x)=>s+x.a,0);
    p.po=p.wk.filter(x=>POW.includes(x.w)).reduce((s,x)=>s+x.pts,0);
    const pw=p.wk.filter(x=>POW.includes(x.w)&&x.opp); p.poM=pw.length?pw.reduce((s,x)=>s+x.m,0)/pw.length:null;
    const rw=p.wk.filter(x=>x.opp); p.rosM=rw.length?rw.reduce((s,x)=>s+x.m,0)/rw.length:null;
    // usage (last 4)
    p.use={att:avgK(l4,'att'),car:avgK(l4,'car'),tgt:avgK(l4,'tgt'),snap:avgK(l4.filter(g=>g.snap!=null),'snap')};
    p.useS={car:avgK(p.games,'car'),tgt:avgK(p.games,'tgt'),snap:avgK(p.games.filter(g=>g.snap!=null),'snap')};
  });
  // replacement levels from the starting lineup demand
  const slots=parseSlots(), N=+L.size||12, taken=new Set(), pool=P.filter(p=>p.st==='ACT').sort((a,b)=>b.ppg-a.ppg);
  activePos().forEach(pos=>{let need=N*(slots[pos]||0); pool.forEach(p=>{if(need>0&&p.pos===pos&&!taken.has(p.i)){taken.add(p.i);need--}})});
  let fl=N*(slots.FLEX||0); pool.forEach(p=>{if(fl>0&&p.pos!=='QB'&&!taken.has(p.i)){taken.add(p.i);fl--}});
  let sf=N*(slots.SFLEX||0); pool.forEach(p=>{if(sf>0&&!taken.has(p.i)){taken.add(p.i);sf--}});
  // replacement = typical waiver-level player: skip past the starters plus each position's share of half the bench (backups/bye cover)
  const perTeam=SUPPORTED.reduce((a,k)=>a+(slots[k]||0),0)||9, benchF=.5*(+L.bench||0)/perTeam;
  REPL={K:0}; activePos().forEach(pos=>{const startersAt=pool.filter(p=>p.pos===pos&&taken.has(p.i)).length, extra=Math.round(startersAt*benchF);
    const nxt=pool.filter(p=>p.pos===pos&&!taken.has(p.i)).slice(extra,extra+3); REPL[pos]=nxt.length?nxt.reduce((s,p)=>s+p.ppg,0)/nxt.length:0;});
  const POW2=playoffWeeks();
  P.forEach(p=>{p.vor=p.wk.reduce((s,x)=>s+x.a*(x.opp?(p.ppg*x.m-REPL[p.pos]):0),0); p.vorPO=p.wk.filter(x=>POW2.includes(x.w)).reduce((s,x)=>s+x.a*(x.opp?(p.ppg*x.m-REPL[p.pos]):0),0);});
  const AP=activePos(); P.forEach(p=>{p.on=AP.includes(p.pos);p.rk=9999}); P.filter(p=>p.on).sort((a,b)=>b.vor-a.vor).forEach((p,i)=>p.rk=i+1);
  [...POS,'K'].forEach(pos=>P.filter(p=>p.pos===pos).sort((a,b)=>b.ros-a.ros).forEach((p,i)=>p.prk=pos+(i+1)));
  OWN={}; (L.teams||[]).forEach((t,i)=>(t.ids||[]).forEach(id=>OWN[id]=i));
  FP=null;
}
const avgK=(arr,k)=>arr.length?arr.reduce((s,g)=>s+(g[k]||0),0)/arr.length:null;
function parseSlots(){const c={};String(L.slots).toUpperCase().split(/[ ,]+/).filter(Boolean).forEach(s=>{if(s==='W/R/T'||s==='FLX')s='FLEX';if(s==='SUPERFLEX'||s==='OP'||s==='Q/W/R/T'||s==='SF')s='SFLEX';if(s==='PK')s='K';if(s==='D/ST'||s==='DST'||s==='D')s='DEF';c[s]=(c[s]||0)+1});return c}
const leagueLoaded=()=>(L.teams||[]).filter(t=>t.ids&&t.ids.length).length>=2;
const fullLeague=()=>(L.teams||[]).filter(t=>t.ids&&t.ids.length).length>=Math.max(2,(+L.size||12)-1);
const myIds=()=>((L.teams[L.my]||{}).ids)||[];
function isAvailable(p){ if(!p.on||OWN[p.id]!=null) return false; if(fullLeague()) return true; const sl=parseSlots(), starters=SUPPORTED.reduce((a,k)=>a+(sl[k]||0),0); return p.rk>(+L.size||12)*(starters+(+L.bench||6))*.8; }

/* ---------- lineup simulation ---------- */
function bestLineup(ids,w){
  const slots=parseSlots(), byPos={QB:[],RB:[],WR:[],TE:[],K:[]};
  ids.forEach(id=>{const p=BYID[id]; if(!p) return; const x=p.wk.find(k=>k.w===w); byPos[p.pos].push({p,pts:x?x.pts:0})});
  [...POS,'K'].forEach(k=>byPos[k].sort((a,b)=>b.pts-a.pts));
  let total=0; const used=new Set(), lineup=[];
  [...POS,'K'].forEach(pos=>{for(let i=0;i<(slots[pos]||0);i++){const c=byPos[pos].find(x=>!used.has(x.p.id)); if(c){used.add(c.p.id);total+=c.pts;lineup.push([pos,c])}}});
  const rest=k=>[].concat(...k.map(pos=>byPos[pos])).filter(x=>!used.has(x.p.id)).sort((a,b)=>b.pts-a.pts);
  for(let i=0;i<(slots.FLEX||0);i++){const c=rest(['RB','WR','TE'])[0]; if(c){used.add(c.p.id);total+=c.pts;lineup.push(['FLEX',c])}}
  for(let i=0;i<(slots.SFLEX||0);i++){const c=rest(POS)[0]; if(c){used.add(c.p.id);total+=c.pts;lineup.push(['SFLEX',c])}}
  return {total,lineup};
}

}

function tdLuck(p){ // actual TDs minus volume-expected TDs this season
  const s=k=>p.games.reduce((a,g)=>a+(g[k]||0),0), rr=LG.rush[p.pos], rc=LG.rec[p.pos];
  const exp=s('car')*rr[1]+s('tgt')*(rc[2]||.04)+(p.pos==='QB'?s('att')*LG.pass.td:0);

  const sell=cand.filter(p=>p.sppg-p.ppg>=1.8&&p.rk<=N*9&&inScope(p)).map(p=>({p,l:tdLuck(p)})).sort((a,b)=>(b.p.sppg-b.p.ppg)-(a.p.sppg-a.p.ppg)).slice(0,12);

/* ---------- future value & draft picks ---------- */
function ageFactor(p){const a=p.age||26,pos=p.pos;
  if(pos==='RB') return a<=25?1:a<26.5?.97:a<27.5?.93:a<28.5?.88:a<29.5?.82:.75;
  if(pos==='WR') return a<=24.5?1.05:a<29?1:a<30?.95:a<31?.9:.82;
  if(pos==='TE') return a<=25.5?1.06:a<30?1:a<31?.94:.86;
  return a<=26?1.03:a<34?1:a<37?.95:.85;}
const nextPPG=p=>p.ppg*ageFactor(p);
function futureValue(p){return Math.max(0,(nextPPG(p)-REPL[p.pos])*17)*.8}
let FP=null;
function futurePool(){ if(FP) return FP; FP=P.filter(p=>p.on&&(p.st==='ACT'||p.st==='RES')).map(futureValue).sort((a,b)=>b-a); return FP; }
const isPick=id=>String(id).startsWith('PK|');
function pickInfo(id){const [,yr,rd,part,kind]=String(id).split('|');return {yr:+yr,rd:+rd,part,kind}}
function pickLabel(id){const k=pickInfo(id);return `${k.yr} ${k.kind==='rookie'?'rookie-draft ':''}round ${k.rd} pick (${k.part})`}
function pickValue(id){const k=pickInfo(id),N=+L.size||12; const slot=k.part==='early'?Math.max(1,Math.round(N*.17)):k.part==='late'?Math.round(N*.83):Math.round(N/2);
  let overall=(k.rd-1)*N+slot; if(k.kind==='rookie') overall=Math.round(overall*3+12);
  const base=futurePool()[overall-1]||0; const yrs=Math.max(0,k.yr-(DATA.season+1)); return base*.75*Math.pow(.85,yrs);}
const LT={redraft:{wp:.6,wf:0,lbl:'Redraft'},keeper:{wp:.8,wf:.35,lbl:'Keeper'},dynasty:{wp:1,wf:1,lbl:'Dynasty'}};
function pickForm(who){const yr=DATA.season+1, rounds=+L.rounds||15;
  return `<div class="bar" style="margin:8px 0 0;gap:6px"><select data-pk-yr="${who}" style="font-size:12px"><option>${yr}</option><option>${yr+1}</option></select><select data-pk-rd="${who}" style="font-size:12px">${Array.from({length:rounds},(_,i)=>`<option value="${i+1}">Round ${i+1}</option>`).join('')}</select><select data-pk-pt="${who}" style="font-size:12px"><option value="early">Early</option><option value="mid" selected>Mid</option><option value="late">Late</option></select>${L.type==='dynasty'?`<select data-pk-kd="${who}" style="font-size:12px"><option value="rookie">Rookie draft</option><option value="startup">Full draft</option></select>`:''}<button class="btn sm" data-pk-add="${who}">+ Add pick</button></div>`;}

/* ---------- MOCK DRAFT ---------- */
let D=null;
function draftValue(p){return Math.max(-50,(nextPPG(p)-REPL[p.pos])*17)}
function newDraft(o){const pool=P.filter(p=>p.on&&p.st!=='SUS').map(p=>({id:p.id,v:draftValue(p)})).sort((a,b)=>b.v-a.v).map(x=>x.id);
  D={teams:o.teams,slot:o.slot-1,rounds:o.rounds,pool,picks:[],rosters:Array.from({length:o.teams},()=>[]),done:false,pos:'ALL',q:''};}
const pickOwner=n=>{const r=Math.floor(n/D.teams),i=n%D.teams;return r%2===0?i:D.teams-1-i};
function needOf(team){const slots=parseSlots(),have={QB:0,RB:0,WR:0,TE:0,K:0};D.rosters[team].forEach(id=>have[BYID[id].pos]++);return pos=>{const req=(slots[pos]||0)+(pos==='QB'?(slots.SFLEX||0):0);return have[pos]<req?2.5:(pos==='QB'||pos==='TE')&&have[pos]>=req+1?-6:0}}
function botPick(team){const av=D.pool.filter(id=>!D.picks.includes(id)),need=needOf(team),r=D.rosters[team].length;
  return av.slice(0,10).map((id,k)=>{const p=BYID[id];let s=-k+(Math.random()*2-1)*Math.max(1.5,(D.picks.length/D.teams)*.6);if(r>=4)s+=need(p.pos);if(r<6&&(p.pos==='QB'||p.pos==='TE')&&k>2)s-=2;if(p.pos==='K'&&r<D.rounds-2)s-=50;return [id,s]}).sort((a,b)=>b[1]-a[1])[0][0];}
function makePick(id){const t=pickOwner(D.picks.length);D.picks.push(id);D.rosters[t].push(id);if(D.picks.length>=D.teams*D.rounds)D.done=true}
function runBots(){if(!D||D.done)return renderDraft();if(pickOwner(D.picks.length)===D.slot)return renderDraft();makePick(botPick(pickOwner(D.picks.length)));renderDraft();setTimeout(runBots,90)}
function renderDraft(){
  const el=$('#t-draft');
  if(!D){el.innerHTML=`<div class="card"><h2>Mock Draft</h2><p class="sub">Snake draft against bots that pick by projected value with positional needs and realistic variance.</p>
    <div class="note">Built for next season: once 2027 projections and preseason data are available, the nightly refresh will feed them in. Until then, mocks use each player's current value adjusted for age.</div>
    <div class="bar"><label>Teams<input type="number" id="d-teams" min="6" max="16" value="${L.size||12}" style="width:80px"></label><label>Your pick<input type="number" id="d-slot" min="1" max="16" value="${Math.floor(Math.random()*(L.size||12))+1}" style="width:80px"></label><label>Rounds<input type="number" id="d-rounds" min="6" max="20" value="${L.rounds||15}" style="width:80px"></label><button class="btn pri" id="d-start" style="align-self:flex-end">Start mock draft</button></div></div>`;
    $('#d-start').onclick=()=>{const t=Math.min(16,Math.max(6,+$('#d-teams').value||12));newDraft({teams:t,slot:Math.min(t,Math.max(1,+$('#d-slot').value||1)),rounds:Math.min(20,Math.max(6,+$('#d-rounds').value||15))});runBots()};return;}
  const n=D.picks.length,onClock=D.done?-1:pickOwner(n),myTurn=onClock===D.slot;
  let av=D.pool.filter(id=>!D.picks.includes(id)).map(id=>BYID[id]); if(D.pos!=='ALL')av=av.filter(p=>p.pos===D.pos); if(D.q)av=av.filter(p=>p.key.includes(norm(D.q)));
  const my=D.rosters[D.slot].map(id=>BYID[id]);
  let board='<div class="tw"><table class="board"><thead><tr><th class="l">Rd</th>'+Array.from({length:D.teams},(_,i)=>`<th class="l">${i===D.slot?'You':'Team '+(i+1)}</th>`).join('')+'</tr></thead><tbody>';
  for(let r=0;r<D.rounds;r++){board+=`<tr><td>${r+1}</td>`;for(let i=0;i<D.teams;i++){const pi=r*D.teams+(r%2===0?i:D.teams-1-i),id=D.picks[pi],p=id?BYID[id]:null;board+=`<td class="${i===D.slot?'me':''} ${pi===n?'now':''}">${p?esc(p.n.split(' ').slice(-1)[0])+` <span class="meta" style="margin:0">${p.pos}</span>`:''}</td>`}board+='</tr>'}board+='</tbody></table></div>';
  let recap='';
  if(D.done){const tot=D.rosters.map(ids=>{let s=0;const slots=parseSlots(),byPos={QB:[],RB:[],WR:[],TE:[],K:[]};ids.forEach(id=>byPos[BYID[id].pos].push(nextPPG(BYID[id])));[...POS,'K'].forEach(k=>byPos[k].sort((a,b)=>b-a));const used={QB:0,RB:0,WR:0,TE:0,K:0};[...POS,'K'].forEach(k=>{for(let i=0;i<(slots[k]||0);i++){s+=byPos[k][used[k]++]||0}});const rest=[].concat(...['RB','WR','TE'].map(k=>byPos[k].slice(used[k]))).sort((a,b)=>b-a);for(let i=0;i<(slots.FLEX||0);i++)s+=rest[i]||0;const rest2=[].concat(...POS.map(k=>byPos[k].slice(used[k]))).sort((a,b)=>b-a).slice(slots.FLEX||0);for(let i=0;i<(slots.SFLEX||0);i++)s+=rest2[i]||0;return s});
    const rk=1+tot.filter(x=>x>tot[D.slot]).length; recap=`<div class="card"><h3>Draft recap</h3><div class="kpi"><div><b>${rk} of ${D.teams}</b><span>Projected starting lineup rank</span></div><div><b>${f1(tot[D.slot])}</b><span>Your projected starters' points per week</span></div></div></div>`;}
  el.innerHTML=`${recap}<div class="grid2" style="grid-template-columns:1.25fr 1fr"><div class="card"><div class="sec-h"><h3>${D.done?'Draft complete':myTurn?`You're on the clock: pick ${n+1} (round ${Math.floor(n/D.teams)+1})`:`Team ${onClock+1} is picking…`}</h3><button class="btn sm" id="d-reset">New draft</button></div>
   <div class="bar"><select id="d-pos">${['ALL',...activePos()].map(x=>`<option ${x===D.pos?'selected':''}>${x}</option>`).join('')}</select><input type="search" id="d-q" placeholder="Search" value="${esc(D.q)}"></div>
   <div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr><th class="l">Rk</th><th class="l">Player</th><th>Age</th><th>Proj PPG</th><th>Value</th><th></th></tr></thead><tbody>${av.slice(0,60).map(p=>`<tr><td class="l">${D.pool.indexOf(p.id)+1}</td><td class="l">${pname(p)}</td><td>${p.age?Math.floor(p.age):'–'}</td><td>${f1(nextPPG(p))}</td><td class="val">${f0(draftValue(p))}</td><td>${myTurn?`<button class="btn sm pri" data-dp="${p.id}">Draft</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="card"><h3>Your team (${my.length}/${D.rounds})</h3>${my.map(p=>`<div class="slot"><span>${pname(p)}</span><span class="meta">${f1(nextPPG(p))} PPG</span></div>`).join('')||'<div class="empty">No picks yet</div>'}</div></div><div class="card"><h3>Draft board</h3>${board}</div>`;
  $('#d-reset').onclick=()=>{D=null;renderDraft()}; $('#d-pos').onchange=e=>{D.pos=e.target.value;renderDraft()};
  $('#d-q').oninput=debounce(e=>{D.q=e.target.value;renderDraft();const q=$('#d-q');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250);
  el.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{makePick(b.dataset.dp);runBots()});
}

/* ---------- persistence ---------- */
function serial(){return {...L,teams:L.teams.map(t=>({name:t.name,ids:t.ids||[],names:(t.ids||[]).map(id=>BYID[id]?BYID[id].n:'')}))}}
function hydrate(o){ if(!o) return; const d=JSON.parse(JSON.stringify(DEFAULT_LEAGUE)); L=Object.assign(d,o); L.scoring=Object.assign(d.scoring,o.scoring||{}); L.ovr=o.ovr||{};
  L.teams=(o.teams||[]).map(t=>({name:t.name,ids:(t.ids||[]).map((id,j)=>BYID[id]?id:((BYKEY[norm((t.names||[])[j]||'')]||{}).id)).filter(Boolean)})); }
let LEAGUES={active:null,list:{}};
const newId=()=>'lg'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function persist(){LEAGUES.list[LEAGUES.active]=serial();try{localStorage.setItem('chq_nfl_leagues',JSON.stringify(LEAGUES))}catch(e){}}
const save=debounce(()=>{persist();renderLgBar()},400);
function loadLeagues(){
  try{const s=localStorage.getItem('chq_nfl_leagues'); if(s) LEAGUES=JSON.parse(s);}catch(e){}
  if(!LEAGUES||!LEAGUES.list||!Object.keys(LEAGUES.list).length){let first=null;try{const o=localStorage.getItem('chq_nfl_league');if(o)first=JSON.parse(o)}catch(e){} const id=newId(); LEAGUES={active:id,list:{[id]:first||JSON.parse(JSON.stringify(DEFAULT_LEAGUE))}};}
  if(!LEAGUES.list[LEAGUES.active]) LEAGUES.active=Object.keys(LEAGUES.list)[0];
  hydrate(LEAGUES.list[LEAGUES.active]);
}
function resetWork(){T.give=[];T.get=[];T.partner=-1;D=null;delArm=false;}
function switchLeague(id){if(!LEAGUES.list[id])return;persist();LEAGUES.active=id;hydrate(LEAGUES.list[id]);resetWork();persist();compute();renderLgBar();renderAll();}
function addLeague(copy){persist();const id=newId();let o;
  if(copy){o=JSON.parse(JSON.stringify(serial()));o.name=L.name+' (copy)';o.teams=[];o.ovr={};}
  else{o=JSON.parse(JSON.stringify(DEFAULT_LEAGUE));o.name='League '+(Object.keys(LEAGUES.list).length+1);}
  LEAGUES.list[id]=o;switchLeague(id);show('league');}
let delArm=false;
function deleteLeague(){const ids=Object.keys(LEAGUES.list);if(ids.length<2)return;delete LEAGUES.list[LEAGUES.active];LEAGUES.active=Object.keys(LEAGUES.list)[0];hydrate(LEAGUES.list[LEAGUES.active]);resetWork();try{localStorage.setItem('chq_nfl_leagues',JSON.stringify(LEAGUES))}catch(e){}compute();renderLgBar();show('rank');}
function slotSummary(slots){const c={};String(slots).toUpperCase().split(/[ ,]+/).filter(Boolean).forEach(x=>{c[x]=(c[x]||0)+1});const out=[];
  out.push((c.SFLEX||c.SUPERFLEX||c.OP||c.SF)?'Superflex':(c.QB||0)>=2?'2QB':'1QB'); if((c.WR||0)>=3)out.push('3WR'); if(c.K||c.PK)out.push('K'); if(c.DEF||c['D/ST']||c.DST)out.push('DEF'); return out.join(' · ');}
function leagueSummary(o){const r=(o.scoring||{}).rec;return `${o.size} teams · ${r===1?'PPR':r===0?'Standard':'Half PPR'} · ${slotSummary(o.slots)}`;}
function renderLgBar(){const ids=Object.keys(LEAGUES.list), cur=serial();
  $('#lgbar').innerHTML=`<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)">League<select id="lg-sel">${ids.map(id=>`<option value="${id}" ${id===LEAGUES.active?'selected':''}>${esc(id===LEAGUES.active?cur.name:LEAGUES.list[id].name)}</option>`).join('')}</select></label><span class="lgsum">${esc(leagueSummary(cur))}${(cur.teams||[]).some(t=>(t.ids||[]).length)?' · rosters loaded':''}</span><span style="flex:1"></span><button class="btn sm" id="lg-new">+ New league</button><button class="btn sm" id="lg-dup" title="Copy these settings into a new league">Duplicate settings</button><button class="btn sm" id="lg-set">Edit settings</button>`;
  $('#lg-sel').onchange=e=>switchLeague(e.target.value); $('#lg-new').onclick=()=>addLeague(false); $('#lg-dup').onclick=()=>addLeague(true); $('#lg-set').onclick=()=>show('league');}

/* ---------- player card ---------- */
function openPlayer(i){
  const p=P[i], cur=DATA.curWeek, o=L.ovr[p.id];
  const wkRows=p.wk.map(x=>`<td style="text-align:center;${x.opp?'':'color:var(--mute)'}">${x.opp?`${esc(x.opp)}<br><span class="meta" style="margin:0">${f1(x.pts)}</span>`:'BYE'}</td>`).join('');
  const gl=p.games.slice().reverse().map(g=>`<tr><td class="l">Wk ${g.wk}</td><td class="l">${esc(g.opp)}</td><td>${f1(pts(g,p.pos))}</td><td>${p.pos==='QB'?`${g.cmp}/${g.att}, ${g.pyd} yds, ${g.ptd} TD, ${g.int} INT`:''}${g.car?` ${g.car}-${g.ryd} rush${g.rtd?', '+g.rtd+' TD':''}`:''}${g.tgt?` · ${g.rec}/${g.tgt} for ${g.recyd}${g.rectd?', '+g.rectd+' TD':''}`:''}</td><td>${g.snap!=null?g.snap+'%':'–'}</td></tr>`).join('');
  const l=tdLuck(p);
  $('#mcard').innerHTML=`<div class="sec-h"><div><h2>${esc(p.n)}</h2><p class="sub">${p.pos} · ${p.t}${p.age?' · age '+Math.floor(p.age):''} · bye week ${(DATA.sched[p.t]||{}).bye||'–'}${OWN[p.id]!=null?' · '+esc(L.teams[OWN[p.id]].name):''}</p></div><button class="btn" id="m-x">Close</button></div>
   ${p.st==='RES'?'<div class="note warnnote">On injured reserve. The default assumes he misses at least 4 more games with an uncertain return; set your own expectation below.</div>':p.inj?`<div class="note warnnote">${esc(p.inj.s)} (${esc(p.inj.body||'injury')}) on the Week ${p.inj.wk} injury report.</div>`:''}
   <div class="kpi"><div><b>${p.prk}</b><span>Position rank, ROS</span></div><div><b>#${p.rk}</b><span>Overall value rank</span></div><div><b>${f1(p.ppg)}</b><span>Projected PPG</span></div><div><b>${f0(p.ros)}</b><span>ROS points (~${f1(p.gl)} games)</span></div><div><b>${f1(p.sppg)}</b><span>Season PPG</span></div></div>
   <div class="bar"><label>Expected availability<select id="m-ovr"><option value="">Use injury report (default)</option><option value="0">Healthy / ignore injury</option>${Array.from({length:(+L.lastWeek||17)-cur},(_,k)=>cur+1+k).map(w=>`<option value="${w}">Back in week ${w}</option>`).join('')}<option value="99">Out for the season</option></select></label></div>
   <h3>Rest-of-season schedule</h3><div class="tw"><table><thead><tr>${p.wk.map(x=>`<th style="text-align:center">Wk ${x.w}</th>`).join('')}</tr></thead><tbody><tr>${wkRows}</tr></tbody></table></div>
   <p class="sub" style="margin-top:6px">Numbers under each opponent are projected points that week (matchup × chance he plays). Touchdowns: ${f0(l.act)} scored vs ${f1(l.exp)} expected from his volume this season.</p>
   <h3 style="margin-top:12px">Game log (${scoringLbl()})</h3><div class="tw" style="max-height:260px;overflow:auto"><table><thead><tr><th class="l">Week</th><th class="l">Opp</th><th>Pts</th><th>Line</th><th>Snaps</th></tr></thead><tbody>${gl||'<tr><td colspan="5" class="l meta">No games this season</td></tr>'}</tbody></table></div>
   <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="m-give">Add to trade: I give</button><button class="btn" id="m-get">Add to trade: I get</button></div>
   <p class="sub" style="margin-top:10px">How the projection works: volume (pass attempts, carries, targets) leans on this season with extra weight on the last 4 games; efficiency and touchdown rates are blended with last season and league norms so hot or cold streaks don't swing it too far; each week is scaled by how many points that opponent allows to his position.</p>`;
  $('#m-ovr').value=o==null?'':String(o);
  $('#m-ovr').onchange=e=>{const v=e.target.value; if(v==='') delete L.ovr[p.id]; else L.ovr[p.id]=+v; save(); compute(); openPlayer(i); renderAll();};
  $('#modal').classList.add('on'); $('#m-x').onclick=closeModal;
  $('#m-give').onclick=()=>{if(!T.give.includes(p.id)){T.get=T.get.filter(x=>x!==p.id);T.give.push(p.id)}closeModal();show('trade')};
  $('#m-get').onclick=()=>{if(!T.get.includes(p.id)){T.give=T.give.filter(x=>x!==p.id);T.get.push(p.id)}closeModal();show('trade')};
}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{const pn=e.target.closest('.pn');if(pn&&pn.dataset.p!=null)openPlayer(+pn.dataset.p)});

/* ---------- shell ---------- */
const RENDER={rank:renderRank,trade:renderTrade,moves:renderMoves,week:renderWeek,draft:renderDraft,league:renderLeague};
let TAB='rank';
function show(t){TAB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));Object.keys(RENDER).forEach(k=>$('#t-'+k).classList.toggle('hide',k!==t));RENDER[t]();try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0)}
function renderAll(){RENDER[TAB]()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
async function init(){
  try{DATA=await fetch('data/nfl.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json())}catch(e){$('#t-rank').innerHTML='<div class="card"><div class="empty">Could not load player data. Try reloading.</div></div>';return}
  build(); loadLeagues();
  compute(); renderLgBar();
  const up=new Date(DATA.updated); $('#stamp').textContent=`Through Week ${DATA.curWeek-1} · updated ${up.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${up.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} · refreshes nightly`;
  $('#foot').innerHTML=`<div>Data: ${(DATA.sources||[]).map(esc).join(' · ')}. Projections are computed in your browser. Kickers and defenses aren't included. League data is saved in this browser.</div>`;
  const h=location.hash.slice(1); show(RENDER[h]?h:'rank');
}
init();
</script>
