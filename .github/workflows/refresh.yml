name: Nightly data refresh

on:
  schedule:
    - cron: "17 10 * * *"   # about 4:17 AM Central (5:17 AM during daylight time)
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python scripts/refresh.py
      - name: Commit updated data
        run: |
          git config user.name "courtside-bot"
          git config user.email "courtside-bot@users.noreply.github.com"
          git add data/nba.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Data refresh $(date -u +%Y-%m-%d)" && git push)
