name: Probe data sources (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/probe_sources.py
      - run: |
          git config user.name "courtside-bot"; git config user.email "courtside-bot@users.noreply.github.com"
          git checkout --orphan tmp-raw && git rm -rq --cached . && git add raw && git commit -qm "raw source snapshot (temporary)" && git push -f origin tmp-raw
