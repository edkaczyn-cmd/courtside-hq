<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtside HQ — Fantasy Basketball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5e6673;--line:#e3e6eb;--hd:#11161f;--acc:#e8641b;--acc2:#1d5fd1;--good:#1e8e4e;--bad:#c93a2e;--warn:#b7791f;--chip:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--hd);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--acc);box-shadow:inset -4px -3px 0 rgba(0,0,0,.18)}
.sport{display:flex;gap:6px}
.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12px;color:#cfd6e2;background:transparent}
.pill.on{background:#fff;color:var(--hd);border-color:#fff;font-weight:600}
.pill[disabled]{opacity:.55}
.stamp{margin-left:auto;font-size:12px;color:#aab3c2}
nav{background:#1a2130;display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:50px;z-index:19}
nav button{background:none;border:0;color:#b9c2d0;padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
nav button.on{color:#fff;border-bottom-color:var(--acc)}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input[type=text],input[type=number],input[type=search],textarea{border:1px solid #cfd4dc;border-radius:7px;padding:6px 9px;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical;font-size:12.5px}
.btn{border:1px solid #cfd4dc;background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#9aa3b0}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:#fde7da;border-color:#f3a77c;color:#9a3a07;text-decoration:line-through}
.chip.x:after{content:" ×";color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f7f8fa;text-align:right;font-weight:600;color:#3b4250;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
th.l,td.l{text-align:left}
td{padding:6px 8px;border-bottom:1px solid #f0f2f5;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfc}
tr.mine td{background:#fff7f1}
.pn{font-weight:600;cursor:pointer;color:var(--ink)}
.pn:hover{color:var(--acc2);text-decoration:underline}
.meta{color:var(--mute);font-size:11.5px;margin-left:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.t-out{background:#fde2df;color:#a32a1f}.t-gtd{background:#fdf1d6;color:#8a5a0b}.t-own{background:#e6eefc;color:#1d4fb0}.t-me{background:#fde7da;color:#9a3a07}
.t-buy{background:#ddf3e6;color:#17693b}.t-sell{background:#fde2df;color:#a32a1f}.t-add{background:#e6eefc;color:#1d4fb0}.t-brk{background:#efe5fb;color:#5b2ea6}
.val{font-weight:700}
.up{color:var(--good)}.dn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}nav{top:0;position:relative}header{position:relative}}
.list .it{padding:10px 0;border-bottom:1px solid #f0f2f5}
.list .it:last-child{border-bottom:0}
.why{color:#3b4250;font-size:12.5px;margin-top:3px}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpi div{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:130px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11.5px;color:var(--mute)}
.verdict{font-size:20px;font-weight:700;padding:10px 14px;border-radius:8px;margin:6px 0 4px;display:inline-block}
.v-win{background:#ddf3e6;color:#17693b}.v-lose{background:#fde2df;color:#a32a1f}.v-even{background:#eef1f5;color:#3b4250}
.picker{position:relative}
.dd{position:absolute;z-index:30;background:#fff;border:1px solid #cfd4dc;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;width:100%;margin-top:2px}
.dd div{padding:7px 10px;cursor:pointer;font-size:13px}
.dd div:hover{background:#f3f5f8}
.slot{display:flex;justify-content:space-between;align-items:center;background:#f7f8fa;border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin:5px 0;font-size:13px}
.empty{color:var(--mute);font-size:13px;padding:14px;text-align:center;border:1px dashed #cfd4dc;border-radius:8px}
.note{background:#f2f6fd;border:1px solid #d7e3f8;color:#1f3c6e;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warnnote{background:#fff8ec;border-color:#f3dcae;color:#6b4a0f}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal.on{display:flex}
.modal .card{max-width:760px;width:100%}
.board{font-size:11.5px}
.board td{text-align:left;padding:4px 6px;border:1px solid #eef0f3;min-width:92px}
.board td.me{background:#fff3ea}
.board td.now{outline:2px solid var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1d5fd1}
.dot.inj{background:#e9b8b2}
.day.today{background:#fff3ea}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
footer{max-width:1280px;margin:0 auto;padding:4px 18px 30px;color:var(--mute);font-size:12px}
footer a{color:var(--mute)}
a{color:var(--acc2)}
.hide{display:none!important}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Courtside HQ</div>
  <div class="sport"><button class="pill on">NBA</button><a class="pill" href="football.html" style="text-decoration:none">NFL</a><button class="pill" disabled title="Baseball rankings and mock drafts arrive before January">MLB · Jan</button></div>
  <div class="stamp" id="stamp">Loading data…</div>
</header>
<nav id="nav">
  <button data-t="rank" class="on">Rankings</button>
  <button data-t="trade">Trade Analyzer</button>
  <button data-t="moves">Buy / Sell &amp; Pickups</button>
  <button data-t="week">My Week</button>
  <button data-t="draft">Mock Draft</button>
  <button data-t="league">League Setup</button>
</nav>
<main>
  <style>.lgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:14px}.lgbar select{font-weight:600;max-width:260px}.lgsum{font-size:12.5px;color:var(--mute)}</style>
  <div id="lgbar" class="lgbar"></div>
  <section id="t-rank"></section>
  <section id="t-trade" class="hide"></section>
  <section id="t-moves" class="hide"></section>
  <section id="t-week" class="hide"></section>
  <section id="t-draft" class="hide"></section>
  <section id="t-league" class="hide"></section>
</main>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="card" id="mcard"></div></div>

<script>
"use strict";
/* ---------- constants & helpers ---------- */
const CATS={'FG%':{pct:1,m:'fgm',a:'fga'},'FT%':{pct:1,m:'ftm',a:'fta'},'3PM':{k:'tpm'},'PTS':{k:'pts'},'REB':{k:'reb'},'AST':{k:'ast'},'STL':{k:'stl'},'BLK':{k:'blk'},'TO':{k:'to',neg:1}};
const ALLCATS=Object.keys(CATS);
const STATK=['gp','mpg','fgm','fga','ftm','fta','tpm','pts','reb','ast','stl','blk','to'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYMS=864e5, TODAY=new Date();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['’.`]/g,'').replace(/[^a-z]+/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,' ').replace(/\s+/g,' ').trim();
const f1=x=>x==null||isNaN(x)?'–':(+x).toFixed(1);
const f2=x=>x==null||isNaN(x)?'–':(+x).toFixed(2);
const pct=x=>x==null||isNaN(x)?'–':(x>=1?'1.000':(+x).toFixed(3).replace(/^0/,''));
const sgn=x=>(x>0?'+':'')+f2(x);
const daysUntil=iso=>Math.ceil((new Date(iso+'T12:00:00')-TODAY)/DAYMS);
const fmtDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
function heat(z){ if(z==null||isNaN(z))return''; const a=Math.min(Math.abs(z)/2.5,1)*.45; return `background:${z>=0?`rgba(30,142,78,${a})`:`rgba(201,58,46,${a})`}`; }
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* ---------- state ---------- */
let DATA=null, PRIOR=null, P=[], BYKEY={}, BYABBR={};
const DEFAULT_LEAGUE={name:'My Yahoo League',size:12,roster:13,slots:'PG,SG,G,SF,PF,F,C,C,UTIL,UTIL',cats:ALLCATS.slice(),punts:[],my:0,teams:[]};
let L=JSON.parse(JSON.stringify(DEFAULT_LEAGUE));
const V={tab:'rank',basis:'ros',mode:'pg',pos:'ALL',q:'',avail:'all',sort:'v',limit:150};
const T={give:[],get:[],partner:-1};
let D=null; // draft
let OWN={}; // player id -> team index

/* ---------- projection model ---------- */
function project(p){
  const c=p.cur,l=p.last; if(!c&&!l) return null;
  const g1=c?c.gp:0,g0=l?l.gp:0, out={};
  out.mpg = c&&l ? (g1*c.mpg+5*l.mpg)/(g1+5) : (c?c.mpg:l.mpg);
  const ps = l ? 14*Math.min(1,g0/35)+1 : 0;          // strength of last-season prior
  const wc = c ? g1/(g1+ps) : 0;
  ['tpm','pts','reb','ast','stl','blk','to','fga','fta'].forEach(k=>{
    const rc=c&&c.mpg>0?c[k]/c.mpg:0, rl=l&&l.mpg>0?l[k]/l.mpg:0;
    out[k]=(wc*rc+(1-wc)*rl)*out.mpg;
  });
  const blend=(m,a,lg,pseudo)=>{let n=lg*pseudo,d=pseudo; if(c){n+=g1*c[m];d+=g1*c[a]} if(l){const w=Math.min(g0,60)*.7;n+=w*l[m];d+=w*l[a]} return d>0?n/d:lg};
  out.fgp=blend('fgm','fga',.475,l?15:40); out.ftp=blend('ftm','fta',.78,l?10:25);
  out.fgm=out.fga*out.fgp; out.ftm=out.fta*out.ftp;
  const teamRem=Math.max(0,(DATA.seasonGames||82)-(DATA.teamGP[p.t]||0));
  let missed=0;
  if(p.inj){ if(p.inj.s==='OUT'&&p.inj.ret) missed=Math.max(0,Math.round(daysUntil(p.inj.ret)*.47)); else if(p.inj.s==='GTD') missed=.5; }
  const hf = l ? .6*.9+.4*Math.min(1,g0/76) : .88;
  out.teamRem=teamRem; out.missed=Math.min(missed,teamRem); out.g=Math.max(0,teamRem-missed)*hf;
  return out;
}

function buildPlayers(){
  const F=PRIOR.fields, inj={}, buzz={};
  (DATA.injuries||[]).forEach(i=>inj[norm(i.n)]=i);
  (DATA.buzz||[]).forEach(b=>{(buzz[norm(b.n)]=buzz[norm(b.n)]||[]).push(b)});
  P=DATA.players.map((r,i)=>{
    const key=norm(r.n), pr=PRIOR.players[key];
    const p={id:i,n:r.n,key,pos:r.pos.split('/'),posStr:r.pos,t:r.t,inj:inj[key]||null,buzz:buzz[key]||[],v:{},z:{},r:{}};
    p.cur = r.gp>0 ? Object.fromEntries(STATK.map(k=>[k,r[k]])) : null;
    if(p.cur){p.cur.g=p.cur.gp;}
    p.last = pr ? Object.fromEntries(F.map((f,j)=>[f,pr[j]])) : null;
    if(p.last){p.last.g=p.last.gp;}
    p.ros=project(p);
    return p;
  });
  BYKEY={};BYABBR={}; const cnt={};
  P.forEach(p=>{BYKEY[p.key]=p; const parts=p.key.split(' '); const ab=parts[0][0]+' '+parts.slice(1).join(' '); p.abbr=ab; cnt[ab]=(cnt[ab]||0)+1;});
  P.forEach(p=>{if(cnt[p.abbr]===1)BYABBR[p.abbr]=p});
  const ALIAS={'alex sarr':'alexandre sarr','alexandre sarr':'alex sarr','nic claxton':'nicolas claxton','nicolas claxton':'nic claxton','herb jones':'herbert jones','herbert jones':'herb jones','cam johnson':'cameron johnson','cameron johnson':'cam johnson','moe wagner':'moritz wagner','moritz wagner':'moe wagner'};
  Object.entries(ALIAS).forEach(([a,b])=>{if(!BYKEY[a]&&BYKEY[b])BYKEY[a]=BYKEY[b]});
}
const B=(p,basis)=>basis==='ros'?p.ros:basis==='std'?p.cur:p.last;

/* ---------- valuation (z-scores) ---------- */
function activeCats(){return L.cats.filter(c=>CATS[c])}
function valueCats(){return activeCats().filter(c=>!L.punts.includes(c))}
function computeValues(){
  const cats=activeCats(), N=Math.max(24,(+L.size||12)*(+L.roster||13));
  ['ros','std','last'].forEach(basis=>['pg','tot'].forEach(mode=>{
    const rows=P.filter(p=>{const b=B(p,basis);return b&&(basis!=='ros'||b.g>0||mode==='pg')});
    let pool=rows, st={};
    for(let pass=0;pass<2;pass++){
      st={};
      cats.forEach(c=>{
        const d=CATS[c], mul=p=>mode==='tot'?B(p,basis).g:1; let lg=0;
        if(d.pct){let sm=0,sa=0; pool.forEach(p=>{const b=B(p,basis);sm+=b[d.m]*mul(p);sa+=b[d.a]*mul(p)}); lg=sa?sm/sa:0;}
        const raw=p=>{const b=B(p,basis),m=mul(p);return d.pct?(b[d.m]-lg*b[d.a])*m:b[d.k]*m*(d.neg?-1:1)};
        const vs=pool.map(raw), mean=vs.reduce((a,b)=>a+b,0)/vs.length, sd=Math.sqrt(vs.reduce((a,b)=>a+(b-mean)**2,0)/vs.length)||1;
        st[c]={raw,mean,sd};
      });
      rows.forEach(p=>{const z={};let s=0;cats.forEach(c=>{z[c]=(st[c].raw(p)-st[c].mean)/st[c].sd; if(!L.punts.includes(c))s+=z[c]});p.z[basis+mode]=z;p.v[basis+mode]=s;});
      pool=rows.slice().sort((a,b)=>b.v[basis+mode]-a.v[basis+mode]).slice(0,Math.min(N,rows.length));
    }
    rows.sort((a,b)=>b.v[basis+mode]-a.v[basis+mode]).forEach((p,i)=>p.r[basis+mode]=i+1);
    P.forEach(p=>{if(!rows.includes(p)){p.v[basis+mode]=null;p.z[basis+mode]=null;p.r[basis+mode]=null}});
  }));
  recomputeOwners();
}
function recomputeOwners(){OWN={};(L.teams||[]).forEach((t,i)=>(t.ids||[]).forEach(id=>{OWN[id]=i}));}
const leagueLoaded=()=>(L.teams||[]).filter(t=>t.ids&&t.ids.length).length>=2;
const myIds=()=>((L.teams[L.my]||{}).ids)||[];
const fullLeague=()=>(L.teams||[]).filter(t=>t.ids&&t.ids.length).length>=Math.max(2,(+L.size||12)-1);
function isAvailable(p){ if(OWN[p.id]!=null) return false; return fullLeague() || (p.r.rospg||999)>(+L.size||12)*(+L.roster||13)*0.85; }

/* ---------- common bits ---------- */
function statusTag(p){
  if(!p.inj) return '';
  if(p.inj.s==='GTD') return `<span class="tag t-gtd" title="${esc(p.inj.inj)}">GTD</span>`;
  const d=p.inj.ret?daysUntil(p.inj.ret):0;
  return `<span class="tag t-out" title="${esc(p.inj.inj)}${p.inj.ret?' · back ~'+fmtDate(p.inj.ret):''}">${d>150?'OUT-SZN':'OUT'+(p.inj.ret&&d>0?' '+fmtDate(p.inj.ret):'')}</span>`;
}
function ownTag(p){ const o=OWN[p.id]; if(o==null) return ''; return o===L.my?'<span class="tag t-me">MINE</span>':`<span class="tag t-own" title="${esc(L.teams[o].name)}">${esc(shortTeam(L.teams[o].name))}</span>`; }
const shortTeam=n=>n.length>12?n.slice(0,11)+'…':n;
function pname(p,extra=''){return `<span class="pn" data-p="${p.id}">${esc(p.n)}</span><span class="meta">${esc(p.posStr)} · ${p.t}</span>${statusTag(p)}${ownTag(p)}${extra}`}
function buzzTags(p){return (p.buzz||[]).map(b=>`<span class="tag t-${b.type==='buy'?'buy':b.type==='sell'?'sell':b.type==='add'?'add':'brk'}" title="${esc(b.src+': '+b.note)}">${b.type.toUpperCase()}</span>`).join('')}
function statCell(b,c,z){
  const d=CATS[c]; let txt;
  if(!b) txt='–'; else if(d.pct) txt=pct(b[d.m]/(b[d.a]||1e-9))+`<span class="meta" style="margin-left:3px">${f1(b[d.a])}</span>`; else txt=f1(b[d.k]);
  const punted=L.punts.includes(c);
  return `<td style="${punted?'opacity:.4':heat(z)}">${txt}</td>`;
}
function playerSearch(el,onPick,filter){
  const inp=el.querySelector('input'), dd=el.querySelector('.dd');
  const show=()=>{const q=norm(inp.value); if(!q){dd.classList.add('hide');return}
    const hits=P.filter(p=>p.key.includes(q)&&(!filter||filter(p))).slice(0,12);
    dd.innerHTML=hits.map(p=>`<div data-id="${p.id}">${esc(p.n)} <span class="meta">${esc(p.posStr)} · ${p.t} · ROS #${p.r.rospg||'–'}</span></div>`).join('')||'<div class="meta">No match</div>';
    dd.classList.remove('hide');};
  inp.addEventListener('input',show); inp.addEventListener('focus',show);
  dd.addEventListener('mousedown',e=>{const d=e.target.closest('[data-id]'); if(!d)return; e.preventDefault(); onPick(P[+d.dataset.id]); inp.value=''; dd.classList.add('hide');});
  inp.addEventListener('blur',()=>setTimeout(()=>dd.classList.add('hide'),150));
}
function puntChips(){return `<div class="chips" id="punts">${activeCats().map(c=>`<span class="chip ${L.punts.includes(c)?'on':''}" data-c="${c}" title="Click to punt / un-punt">${c}</span>`).join('')}</div>`}
function bindPunts(root){root.querySelectorAll('#punts .chip').forEach(ch=>ch.onclick=()=>{const c=ch.dataset.c; L.punts=L.punts.includes(c)?L.punts.filter(x=>x!==c):[...L.punts,c]; computeValues(); save(); renderAll();})}

/* ---------- RANKINGS ---------- */
function renderRank(){
  const el=$('#t-rank'), key=V.basis+V.mode, cats=activeCats();
  const basisLbl={ros:'Rest-of-season projection',std:'2026-27 season to date',last:'2025-26 full season'}[V.basis];
  let rows=P.filter(p=>p.v[key]!=null);
  if(V.pos!=='ALL') rows=rows.filter(p=>V.pos==='G'?p.pos.some(x=>x==='PG'||x==='SG'):V.pos==='F'?p.pos.some(x=>x==='SF'||x==='PF'):p.pos.includes(V.pos));
  if(V.q) rows=rows.filter(p=>p.key.includes(norm(V.q)));
  if(V.avail==='fa') rows=rows.filter(isAvailable); else if(V.avail==='mine') rows=rows.filter(p=>OWN[p.id]===L.my);
  const sorters={v:p=>-p.v[key],n:p=>p.n,trend:p=>-((p.r.stdpg||300)-(p.r.rospg||300)),g:p=>-(B(p,V.basis).g||0),mpg:p=>-(B(p,V.basis).mpg||0)};
  cats.forEach(c=>sorters[c]=p=>-(p.z[key]||{})[c]);
  const sf=sorters[V.sort]||sorters.v; rows.sort((a,b)=>{const x=sf(a),y=sf(b);return x<y?-1:x>y?1:0});
  const shown=rows.slice(0,V.limit);
  el.innerHTML=`<div class="card">

/* ---------- TRADE ANALYZER ---------- */
function teamWeekly(ids){
  const s={fgm:0,fga:0,ftm:0,fta:0,tpm:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0};
  ids.forEach(id=>{const b=P[id]&&P[id].ros; if(!b) return; const share=b.teamRem?Math.min(1,b.g/b.teamRem):0; Object.keys(s).forEach(k=>s[k]+=b[k]*share*3.4)});
  return s;
}
const catVal=(s,c)=>{const d=CATS[c];return d.pct?(s[d.a]?s[d.m]/s[d.a]:0):s[d.k]};
function catRanks(teamsIds,c){ const vals=teamsIds.map(ids=>catVal(teamWeekly(ids),c)); return vals.map(v=>1+vals.filter(x=>CATS[c].neg?x<v:x>v).length); }
function replacementValue(excludeIds){
  const ex=new Set(excludeIds); let best=null;
  P.forEach(p=>{ if(ex.has(p.id)||p.v.rospg==null) return; if(leagueLoaded()?OWN[p.id]!=null:(p.r.rospg<=(+L.size)*(+L.roster))) return; if(p.inj&&p.inj.s==='OUT'&&daysUntil(p.inj.ret||'2026-01-01')>21) return; if(!best||p.v.rospg>best.v.rospg) best=p;});
  return best;
}

}

/* ---------- MY WEEK ---------- */
function weekInfo(){
  const w=DATA.week||{}; if(!w.start) return {valid:false};
  const start=new Date(w.start+'T00:00:00'), idx=Math.floor((TODAY-start)/DAYMS);
  return {valid:idx>=0&&idx<7, todayIdx:idx, start, days:w.days||{}};
}
function gamesLeft(team,wk){const d=(wk.days||{})[team]||[];let n=0;for(let i=Math.max(0,wk.todayIdx);i<7;i++)n+=d[i]||0;return n}
function playsOn(p,i,wk){ if(!(wk.days[p.t]||[])[i]) return 0; if(p.inj&&p.inj.s==='OUT'&&p.inj.ret){const day=new Date(wk.start.getTime()+i*DAYMS); if(day<new Date(p.inj.ret+'T00:00:00')) return -1;} return 1; }
function optimizeDay(ids,slots){

  const order=ids.slice().sort((a,b)=>(P[b].v.rospg||-9)-(P[a].v.rospg||-9)), assign=new Array(slots.length).fill(-1);

function botPick(team){
  const avail=D.pool.filter(id=>!D.picks.includes(id)); const roster=D.rosters[team].map(id=>P[id]);
  const hasC=roster.filter(p=>p.pos.includes('C')).length, hasG=roster.filter(p=>p.pos.some(x=>x==='PG'||x==='SG')).length;
  const cands=avail.slice(0,8).map(id=>{const p=P[id];let s=-p.r.rostot+(Math.random()*2-1)*Math.max(2,p.r.rostot*.12);

  return cands[0][0];
}
function makePick(id){const n=D.picks.length,t=pickOwner(n);D.picks.push(id);D.rosters[t].push(id);if(D.picks.length>=D.teams*D.rounds)D.done=true;}

function openPlayer(id){
  const p=P[id], cats=activeCats(); const rowsB=[['Last season (2025-26)',p.last,'lastpg'],['This season',p.cur,'stdpg'],['Rest-of-season projection',p.ros,'rospg']];
  $('#mcard').innerHTML=`<div class="sec-h"><div><h2>${esc(p.n)}</h2><p class="sub">${esc(p.posStr)} · ${p.t}${OWN[p.id]!=null?' · '+esc(L.teams[OWN[p.id]].name):''}</p></div><button class="btn" id="m-x">Close</button></div>
   ${p.inj?`<div class="note warnnote">${p.inj.s==='GTD'?'Game-time decision':'Out'} · ${esc(p.inj.inj)}${p.inj.ret?' · expected back around '+fmtDate(p.inj.ret):''}</div>`:''}
   <div class="kpi"><div><b>#${p.r.rospg||'–'}</b><span>ROS rank, per game</span></div><div><b>#${p.r.rostot||'–'}</b><span>ROS rank, totals</span></div><div><b>#${p.r.stdpg||'–'}</b><span>Season-to-date rank</span></div><div><b>${p.ros?Math.round(p.ros.g):'–'}</b><span>Projected games left</span></div></div>
   <div class="tw"><table><thead><tr><th class="l"></th><th>G</th><th>MIN</th>${cats.map(c=>`<th>${c}</th>`).join('')}<th>Value</th></tr></thead><tbody>${rowsB.map(([lbl,b,k])=>`<tr><td class="l">${lbl}</td><td>${b?(b.gp!=null?b.gp:Math.round(b.g)):'–'}</td><td>${b?f1(b.mpg):'–'}</td>${cats.map(c=>statCell(b,c,(p.z[k]||{})[c])).join('')}<td class="val">${f2(p.v[k])}</td></tr>`).join('')}</tbody></table></div>
   ${p.buzz.length?`<h3 style="margin-top:14px">Expert buzz</h3>${p.buzz.map(b=>`<div class="why"><span class="tag t-${b.type==='buy'?'buy':b.type==='sell'?'sell':b.type==='add'?'add':'brk'}" style="margin:0 6px 0 0">${b.type.toUpperCase()}</span><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.src)}</a>: ${esc(b.note)}</div>`).join('')}`:''}
   <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="m-give">Add to trade: I give</button><button class="btn" id="m-get">Add to trade: I get</button></div>
   <p class="sub" style="margin-top:10px">How the projection works: per-minute production blends this season with last season (this season's weight grows with games played), minutes lean on this season's role, shooting percentages are stabilized by attempts, and projected games account for the team schedule, the current injury report and the player's recent durability.</p>`;
  $('#modal').classList.add('on');
  $('#m-x').onclick=closeModal;
  $('#m-give').onclick=()=>{if(!T.give.includes(id)){T.get=T.get.filter(x=>x!==id);T.give.push(id)}closeModal();show('trade')};
  $('#m-get').onclick=()=>{if(!T.get.includes(id)){T.give=T.give.filter(x=>x!==id);T.get.push(id)}closeModal();show('trade')};
}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{const pn=e.target.closest('.pn'); if(pn&&pn.dataset.p!=null){openPlayer(+pn.dataset.p)}});

/* ---------- shell ---------- */
const RENDER={rank:renderRank,trade:renderTrade,moves:renderMoves,week:renderWeek,draft:renderDraft,league:renderLeague};
function show(t){V.tab=t; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); Object.keys(RENDER).forEach(k=>$('#t-'+k).classList.toggle('hide',k!==t)); RENDER[t](); if(location.hash.slice(1)!==t){try{history.replaceState(null,'','#'+t)}catch(e){}} window.scrollTo(0,0);}
function renderAll(){RENDER[V.tab]()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(RENDER[h]&&h!==V.tab) show(h)});
function setFoot(){
  $('#foot').innerHTML=`<div>Data: ${(DATA.sources||[]).map(esc).join(' · ')}. Rankings are computed in your browser from those numbers. League data is saved in this browser.</div>`;
}
function setStamp(){const up=new Date(DATA.updated); $('#stamp').textContent=`Data updated ${up.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${up.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} · refreshes nightly`;}
async function init(){
  try{
    const [d,pr]=await Promise.all([fetch('data/nba.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('data/nba_prior.json').then(r=>r.json())]);
    DATA=d;PRIOR=pr;
  }catch(e){ $('#t-rank').innerHTML='<div class="card"><div class="empty">Could not load player data. Try reloading the page.</div></div>'; return; }
  buildPlayers(); computeValues();
  setStamp();
  setFoot();
  const h=location.hash.slice(1); show(RENDER[h]?h:'rank');
  loadSaved().then(()=>{computeValues();renderLgBar();renderAll()});
}
init();
</script>
</body>
</html>
